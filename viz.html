<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><script src="sl-sports.js"></script><script src="navcfg-v2.js"></script><script src="v2.js"></script><title>Data Viz Builder · NFL Hub</title><style>.cf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}.cf label{font-size:10.5px;color:var(--mut);font-weight:800;letter-spacing:.05em;text-transform:uppercase;display:flex;flex-direction:column;gap:4px}#tip{position:fixed;pointer-events:none;background:#0e172bf0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:none;z-index:9}canvas{width:100%;border-radius:14px;background:#0a1224;border:1px solid var(--line);touch-action:none}</style><script src="https://sportslabshq.com/sl/sl.js?v=11" defer></script></head><body><div class="w">
<h2 style="margin-top:14px">Data viz builder</h2>
<div class="cf"><label>League<select class="v2" id="lg"><option value="nfl">NFL</option><option value="cfb" disabled>College (soon)</option></select></label><label>Entity<select class="v2" id="en"><option value="team">Team</option><option value="player">Player</option></select></label><label>Season<select class="v2" id="se"></select></label><label>Weeks<span style="display:flex;gap:4px"><select class="v2" id="w1"></select><select class="v2" id="w2"></select></span></label><label>X axis<select class="v2" id="xa"></select></label><label>Y axis<select class="v2" id="ya"></select></label><label>Display<select class="v2" id="dm"><option value="logo">Team logos</option><option value="dot">Dots</option></select></label><label>Conference<select class="v2" id="cf"><option value="">Both</option><option>AFC</option><option>NFC</option></select></label></div>
<div style="display:flex;gap:8px;margin-bottom:8px"><button class="chip" id="png">⬇ PNG</button><button class="chip" id="share">🔗 Copy share link</button><span class="mut sm" id="msg" style="align-self:center"></span></div>
<canvas id="cv" width="1100" height="760"></canvas><div id="tip"></div><footer>Built from public play-by-play (offense & defense plays: passes and runs with EPA). Player mode needs a minimum volume (20 targets, 30 carries or 60 dropbacks in range). Dashed lines = average of shown points.</footer></div>
<script>
var TM={epa:["EPA/play (offense)",a=>a.epa/a.n],depa:["EPA/play allowed (defense)",a=>a.depa/a.dn],suc:["Success rate (offense)",a=>a.suc/a.n],dsuc:["Success rate allowed",a=>a.dsuc/a.dn],pepa:["Pass EPA/dropback",a=>a.pepa/a.pn],repa:["Rush EPA/carry",a=>a.repa/a.rn],dpepa:["Pass EPA allowed",a=>a.dpepa/a.dpn],drepa:["Rush EPA allowed",a=>a.drepa/a.drn],psuc:["Pass success rate",a=>a.psuc/a.pn],rsuc:["Rush success rate",a=>a.rsuc/a.rn],prate:["Pass rate",a=>a.pn/a.n],skr:["Sack rate allowed",a=>a.sk/a.pn],dskr:["Sack rate (defense)",a=>a.dsk/a.dpn],adot:["aDOT",a=>a.ay/a.att],stuff:["Stuff rate",a=>a.stuff/a.rn]};
var PM={ts:["Target share",a=>a.tg/a.ttg,a=>a.tg>=20],adot:["aDOT",a=>a.ay/a.tg,a=>a.tg>=20],tpg:["Targets per game",a=>a.tg/a.g,a=>a.tg>=20],repa:["EPA per target",a=>a.repa/a.tg,a=>a.tg>=20],cpg:["Carries per game",a=>a.ca/a.g,a=>a.ca>=30],ruepa:["Rush EPA/carry",a=>a.ruepa/a.ca,a=>a.ca>=30],rusuc:["Rush success rate",a=>a.rusuc/a.ca,a=>a.ca>=30],paepa:["EPA/dropback (QB)",a=>a.paepa/a.db,a=>a.db>=60],pasuc:["Success rate (QB)",a=>a.pasuc/a.db,a=>a.db>=60]};
var Q=new URLSearchParams(location.search),S={en:Q.get("en")||"team",se:Q.get("se")||"2026",w1:+Q.get("w1")||1,w2:+Q.get("w2")||99,x:Q.get("x")||"epa",y:Q.get("y")||"depa",dm:Q.get("dm")||"logo",cf:Q.get("cf")||""};
fetch("data/pbp_v2.json").then(r=>r.json()).then(function(P){NFLV2.data(function(D){var cx=cv.getContext("2d"),IM={},pts=[];var CONF={};Object.entries(P.div).forEach(([d,s])=>s.split(" ").forEach(t=>CONF[t]=d.slice(0,3)));
var LG=t=>D.logos[t=="LA"?"LAR":t=="WAS"?"WSH":t];
se.innerHTML=P.seasons.map(s=>"<option>"+s+"</option>").join("");
function opts(){var M=S.en=="team"?TM:PM;["x","y"].forEach(function(a){var el=a=="x"?xa:ya;if(!M[S[a]])S[a]=Object.keys(M)[a=="x"?0:1];el.innerHTML=Object.keys(M).map(k=>'<option value="'+k+'"'+(S[a]==k?" selected":"")+'>'+M[k][0]+'</option>').join("")});var mw=P.maxw[S.se];S.w2=Math.min(S.w2,mw);[w1,w2].forEach((el,i)=>el.innerHTML=Array.from({length:mw},(_,j)=>'<option'+(j+1==(i?S.w2:S.w1)?" selected":"")+'>'+(j+1)+'</option>').join(""));en.value=S.en;se.value=S.se;dm.value=S.dm;cf.value=S.cf;dm.disabled=S.en=="player"}
function agg(){var A={},src=S.en=="team"?P.tw[S.se]:P.pw[S.se];Object.entries(src).forEach(function([k,v]){var [id,w]=k.split("|");w=+w;if(w<S.w1||w>S.w2)return;var a=A[id]=A[id]||{g:0,nm:v.nm,t:v.t||id};a.g++;for(var f in v)if(typeof v[f]=="number")a[f]=(a[f]||0)+v[f];a.t=v.t||id});
 var M=S.en=="team"?TM:PM;pts=Object.entries(A).map(function([id,a]){var t=S.en=="team"?id:a.t;if(S.cf&&CONF[t]!=S.cf)return null;if(S.en=="player"&&!(M[S.x][2](a)&&M[S.y][2](a)))return null;var x=M[S.x][1](a),y=M[S.y][1](a);return isFinite(x)&&isFinite(y)?{id,t,nm:S.en=="team"?id:a.nm,x,y,g:a.g}:null}).filter(Boolean)}
function draw(){agg();var W=cv.width,H=cv.height,p=70,M=S.en=="team"?TM:PM;cx.fillStyle="#0a1224";cx.fillRect(0,0,W,H);if(!pts.length){cx.fillStyle="#8592ad";cx.font="20px sans-serif";cx.fillText("No data in range",W/2-80,H/2);return}
 var xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),dx=(x1-x0)*.08||1,dy=(y1-y0)*.08||1;x0-=dx;x1+=dx;y0-=dy;y1+=dy;
 var inv=/allowed/.test(M[S.y][0]);var X=v=>p+(v-x0)/(x1-x0)*(W-p*1.5),Y=v=>inv?p*.6+(v-y0)/(y1-y0)*(H-p*1.6):H-p-(v-y0)/(y1-y0)*(H-p*1.6);
 cx.strokeStyle="#1e2c4a";cx.lineWidth=1;cx.font="13px sans-serif";cx.fillStyle="#8592ad";for(var i=0;i<=5;i++){var vx=x0+(x1-x0)*i/5,vy=y0+(y1-y0)*i/5;cx.beginPath();cx.moveTo(X(vx),p*.6);cx.lineTo(X(vx),H-p);cx.stroke();cx.fillText(vx.toFixed(3),X(vx)-18,H-p+20);cx.beginPath();cx.moveTo(p,Y(vy));cx.lineTo(W-p/2,Y(vy));cx.stroke();cx.fillText(vy.toFixed(3),8,Y(vy)+4)}
 var mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;cx.setLineDash([6,6]);cx.strokeStyle="#38d0f0aa";cx.beginPath();cx.moveTo(X(mx),p*.6);cx.lineTo(X(mx),H-p);cx.moveTo(p,Y(my));cx.lineTo(W-p/2,Y(my));cx.stroke();cx.setLineDash([]);
 cx.fillStyle="#eef2fa";cx.font="bold 15px sans-serif";cx.fillText(M[S.x][0]+" →",W/2-90,H-22);cx.save();cx.translate(20,H/2+80);cx.rotate(-Math.PI/2);cx.fillText(M[S.y][0]+(inv?" (better ↑)":" →"),0,0);cx.restore();
 cx.font="bold 18px sans-serif";cx.fillText("NFL "+(S.en=="team"?"teams":"players")+" · "+S.se+" wks "+S.w1+"–"+S.w2+(S.cf?" · "+S.cf:""),p,30);cx.font="12px sans-serif";cx.fillStyle="#8592ad";cx.fillText("Sports Labs · NFL Hub",W-150,30);
 pts.forEach(function(q){q.px=X(q.x);q.py=Y(q.y);var im=IM[q.t];if(S.en=="team"&&S.dm=="logo"&&im&&im.complete&&im.naturalWidth){cx.drawImage(im,q.px-18,q.py-18,36,36)}else{cx.fillStyle=CONF[q.t]=="AFC"?"#ff6b7d":"#5b8cff";cx.beginPath();cx.arc(q.px,q.py,S.en=="team"?8:6,0,7);cx.fill();if(S.en=="team"){cx.fillStyle="#eef2fa";cx.font="bold 11px sans-serif";cx.fillText(q.t,q.px+10,q.py+4)}}});
 history.replaceState(null,"","?"+new URLSearchParams(S))}
Object.keys(CONF).forEach(function(t){var i=new Image();i.crossOrigin="anonymous";i.onload=()=>draw();i.src=LG(t);IM[t]=i});
function rd(){S.en=en.value;S.se=se.value;S.w1=+w1.value;S.w2=Math.max(+w2.value,S.w1);S.x=xa.value;S.y=ya.value;S.dm=dm.value;S.cf=cf.value;opts();draw()}
[en,se,w1,w2,xa,ya,dm,cf].forEach(e=>e.onchange=rd);opts();draw();
cv.onmousemove=function(e){var b=cv.getBoundingClientRect(),sx=cv.width/b.width,mx=(e.clientX-b.left)*sx,my=(e.clientY-b.top)*sx,h=pts.find(q=>Math.hypot(q.px-mx,q.py-my)<18),M=S.en=="team"?TM:PM;if(!h){tip.style.display="none";return}tip.style.display="block";tip.style.left=e.clientX+12+"px";tip.style.top=e.clientY+12+"px";tip.innerHTML="<b>"+NFLV2.E(h.nm)+"</b> "+(S.en=="player"?h.t:"")+"<br>"+M[S.x][0]+": "+h.x.toFixed(3)+"<br>"+M[S.y][0]+": "+h.y.toFixed(3)+"<br><span class=mut>"+h.g+" games</span>"};cv.onmouseleave=()=>tip.style.display="none";
png.onclick=function(){var a=document.createElement("a");a.download="nflhub-viz.png";a.href=cv.toDataURL("image/png");a.click()};
share.onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(location.href);msg.textContent="Link copied"}})})</script><script src="propintel.js?v=1" defer></script></body></html>
