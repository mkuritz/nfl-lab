<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Hub · Advanced analytics preview</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="v2.css?v=1105adv">
<style>
  body{margin:0;background:#070d1a;color:#eef2fa;font:14px/1.45 Inter,system-ui,sans-serif}
  .banner{background:#13203a;border-bottom:1px solid #1e2c4a;padding:10px 14px;font-size:13px}
  .banner b{color:#38d0f0}
  .row{padding:14px;display:flex;gap:8px;flex-wrap:wrap}
  .row button{background:#16213a;border:1px solid #23314f;color:#e5e7eb;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer}
  .row button:hover{border-color:#38d0f0}
  #note{padding:0 14px 20px;color:#8592ad;font-size:12.5px;max-width:820px}
</style>
<div class="banner"><b>PREVIEW ONLY</b> — Advanced team/player analytics + travel/rest momentum. Not live. Branch <code>preview/nfl-advanced-analytics-1105</code>.</div>
<div class="row">
  <button type="button" id="bal-ad">BAL · Advanced</button>
  <button type="button" id="bal-mo">BAL · Momentum (travel/rest)</button>
  <button type="button" id="phi-ad">PHI · Advanced</button>
  <button type="button" id="zay">Zay Flowers · Player</button>
  <button type="button" id="henry">Derrick Henry · Player</button>
</div>
<p id="note">Opens the same team/player profile modals as the live hub, fed by local <code>data/advanced.json</code>. Display only — does not feed models or Highlighted plays.</p>
<script src="status-labels.js?v=2"></script>
<script src="nflteam.js?v=1105adv"></script>
<script src="nflprofile.js?v=1105adv"></script>
<script>
function go(){
  var q=new URLSearchParams(location.search);
  var t=q.get('team'), tab=q.get('tab')||'ad', pid=q.get('player');
  if(pid && window.NFLProfile){ setTimeout(function(){ NFLProfile(pid); }, 400); return; }
  if(t && window.NFLTeam){ setTimeout(function(){ NFLTeam(t, tab); }, 500); }
}
document.getElementById('bal-ad').onclick=function(){ NFLTeam('BAL','ad'); };
document.getElementById('bal-mo').onclick=function(){ NFLTeam('BAL','mo'); };
document.getElementById('phi-ad').onclick=function(){ NFLTeam('PHI','ad'); };
document.getElementById('zay').onclick=function(){ NFLProfile('4429615'); };
document.getElementById('henry').onclick=function(){ NFLProfile('3043078'); };
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', go); else go();
</script>
