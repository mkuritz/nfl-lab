name: NFL Hub data
on:
  schedule:
    - cron: "15 11 * * *"        # 7:15 AM ET daily (news, standings, lines)
    - cron: "5 20 * * 3,4,5"      # ~4:05 PM ET Wed-Fri: official injury report window
    - cron: "45 22 * * 4"        # ~6:45 PM ET Thu: 90 min before TNF
    - cron: "30 15 * * 0"        # ~11:30 AM ET Sun: 90 min before early window
    - cron: "*/30 17-23 * * 0"   # Sun game windows (live scores)
    - cron: "*/30 0-4 * * 1,2,5" # late SNF/MNF/TNF finishes (UTC next day)
    - cron: "45 22 * * 1"        # ~6:45 PM ET Mon: before MNF
    - cron: "20 9 * * 1,2,5"     # ~5:20 AM ET after games: trends refresh
  workflow_dispatch:
concurrency: { group: nfl-hub-data, cancel-in-progress: false }
permissions: {}   # least privilege by default; write scope granted per job below
jobs:
  pull:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fetch.py nfl
        env:
          SL_BACKUP_KEY: ${{ secrets.SL_BACKUP_KEY }}
      - name: Trends (after-game and daily runs only)
        if: github.event.schedule == '20 9 * * 1,2,5' || github.event.schedule == '15 11 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/trends.py
      - name: Player profiles (stats, snaps, depth chart, injuries, news)
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/profiles.py
      - run: |
          git config user.name "sports-labs-bot"; git config user.email "actions@users.noreply.github.com"
          python3 scripts/srcscrub.py data; git add data; git diff --cached --quiet || (git commit -m "NFL Hub data $(date -u +%FT%TZ)" && git pull --rebase && git push)
