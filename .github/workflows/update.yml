name: NFL Hub data
on:
  schedule:
    - cron: "15 11 * * *"        # 7:15 AM ET daily (news, standings, lines)
    - cron: "5 20 * * 3,4,5"      # ~4:05 PM ET Wed-Fri: official injury report window
    - cron: "45 22 * * 4"        # ~6:45 PM ET Thu: 90 min before TNF
    - cron: "30 15 * * 0"        # ~11:30 AM ET Sun: 90 min before early window
    - cron: "*/30 17-23 * * 0"   # Sun game windows (live scores)
    - cron: "*/30 0-4 * * 1,2,5" # late SNF/MNF/TNF finishes (UTC next day)
    - cron: "45 22 * * 1"        # ~6:45 PM ET Mon: before MNF
    - cron: "20 9 * * 1,2,5"     # ~5:20 AM ET after games: trends refresh
  workflow_dispatch:
concurrency: { group: nfl-hub-data, cancel-in-progress: false }
permissions: {}   # least privilege by default; write scope granted per job below
jobs:
  pull:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fetch.py nfl
        env:
          SL_BACKUP_KEY: ${{ secrets.SL_BACKUP_KEY }}
      - name: Trends (after-game and daily runs only)
        if: github.event.schedule == '20 9 * * 1,2,5' || github.event.schedule == '15 11 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/trends.py
      - name: Player profiles (stats, snaps, depth chart, injuries, news)
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/profiles.py
      - name: Per-player status check (display only)
        continue-on-error: true
        timeout-minutes: 4
        run: python3 scripts/player_status.py
      - name: Status overlay labels (display only; trending-out / Watch)
        continue-on-error: true
        timeout-minutes: 2
        run: python3 scripts/build_status_overlay.py
      - name: Matchup Analyzer data (display only)
        continue-on-error: true
        timeout-minutes: 4
        run: python3 scripts/build_matchup_analyzer.py
      - name: Defense vs position pop-up data
        continue-on-error: true
        run: python scripts/dvpviz.py
      - name: NFL Hub v2 (props board, power, season sim, TD v2 - TD never Highlighted)
        continue-on-error: true
        timeout-minutes: 10
        run: pip install -q pandas pyarrow numpy && bash scripts/v2/run.sh
      - name: Matchup Board (display only)
        continue-on-error: true
        run: python3 scripts/matchups.py
      - name: Head-to-Head Prop Advantage (every game on the slate; display only)
        continue-on-error: true
        timeout-minutes: 6
        run: pip install -q pandas pyarrow && python3 scripts/build_h2h.py
      - run: |
          git config user.name "sports-labs-bot"; git config user.email "actions@users.noreply.github.com"
          python3 scripts/srcscrub.py data; git add data; git diff --cached --quiet && exit 0
          git commit -m "NFL Hub data $(date -u +%FT%TZ)"
          # data/ files are fully regenerated by this run, so on a rebase conflict keep this run's copy
          # (-X theirs = the commit being replayed). Retry if another job pushed in between.
          for i in 1 2 3 4; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i*10))
          done
          exit 1
